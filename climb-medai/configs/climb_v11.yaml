# climb-medai operating point: v11.
#
# The single source of truth for the VO/PnP method's hyperparameters -- not
# overridable from the CLI. To try a different operating point, copy this
# file and set CLIMB_MEDAI_CONFIG (or point run.py's CONFIG_PATH) at it.
#
# Lineage: v9c (8bab9f3) + pnp.max_flow 70.0 -> 100.0 px. Single-variable
# change off the leaderboard-selected baseline.
#
# v9c SCORED 2026-09-09: mean_ate 6.929mm, RPE-rot 3.977deg, climb_score
# 7.152 -- best of the campaign, and the best raw RPE-rot (the challenge
# tie-breaker) of any submission. v11's A/B target is exactly those numbers.
#
# Why 100px (exp_60): the max_flow sweep (20-200px) found the axis flat
# upward -- 100px is +0.2% local 3-clip ATE vs the 70px baseline (p=0.851,
# statistically indistinguishable) and ties 50px on the 4-clip mean while
# beating it on the fair 3-clip subset (+0.2% vs +1.6%). It is the
# best-evidenced non-baseline point, NOT a local win: local val predicts a
# null here. Scored on the campaign's repeated finding that the 4-clip local
# val anti-predicts hidden-set outcomes (>=7 occurrences). Downward is a
# cliff (35px +7.1% p=0.004; 20px loses Seq_001_a entirely) -- do not go
# below 50.
#
# v10 (--edge-select-mode importance) SCORED WORSE (climb_score 9.487, TFR
# 95%->83.6% on the hidden set) despite better raw ATE/RPE-rot locally --
# edge-select stays "off" here until that regression is understood.

model:
  depth_ckpt: weights/colonstreamsfsnet/best_model.pth  # relative to run.py's own directory

resolution:
  native_width: 1440
  native_height: 1080
  work_width: 640
  work_height: 480

# Fixed camera calibration -- one Kannala-Brandt fisheye model.
calibration:
  native_fx: 727.1851
  native_fy: 728.5954
  native_cx: 738.1817
  native_cy: 537.4003
  work_fx: 323.19337777777775
  work_fy: 323.82017777777776
  work_cx: 328.0807555555555
  work_cy: 238.84457777777777
  k1: -0.1311029   # Kannala-Brandt distortion k1..k4
  k2: -0.005149247
  k3: 0.001512357
  k4: -6.998448e-05

depth:
  specular_thresh: 240       # exclude near-white specular pixels (min(B,G,R) >= this); <0 = off
  mask_dilate_px: 1          # dilate the invalid-pixel mask by this many px (kernel 2n+1)
  min_depth: 0.3             # mm -- trusted depth range for a pixel to become a correspondence
  max_depth: 100.0           # mm -- matches the depth decoder's output ceiling

flow:
  num_flow_updates: 6        # RAFT GRU refinement iterations per frame

pnp:
  min_points: 1200           # min surviving correspondences to attempt a pose
  max_points: 4000           # max correspondences sampled per frame before RANSAC
  max_flow: 100.0            # px -- v11/exp_60: loosened from v9c 70.0 (sweep found the axis flat upward)
  min_inliers: 133           # min RANSAC inliers to accept a pose
  pnp_reproj_err: 2.0        # solvePnPRansac reprojection threshold, rectified px
  pnp_iterations: 400
  pnp_confidence: 0.999
  pnp_refine: true

rectification:
  undistort_points_enabled: true
  fisheye_theta_max_deg: 40.0  # max incidence angle kept through fisheye rectification

clamp:
  max_trans: 10.0    # mm/frame -- scales the pose down, never rejects
  max_rot_deg: 2.6   # deg/frame -- measured COLMAP GT per-frame rotation p99

submap:
  submap_cut_n: 5      # close the current sub-map after this many consecutive VO-failure frames
  submap_reopen_m: 10  # consecutive accepted frames required to open a new sub-map after a cut
